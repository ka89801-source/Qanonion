<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قانوني</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <span class="logo">⚖️ قانوني</span>
    <nav>
      <a href="#">الرئيسية</a>
      <a href="#">استكشاف</a>
    </nav>
  </header>

  <main class="layout">

    <aside class="sidebar">
      <div class="profile-card">
        <div class="avatar">م</div>
        <div>
          <strong>محامي أحمد</strong>
          <p>متخصص في القانون التجاري</p>
        </div>
      </div>
      <button class="btn-post" id="openModal">+ نشر منشور</button>
    </aside>

    <section class="feed" id="feed">
      <div class="post">
        <div class="post-header">
          <div class="avatar sm">س</div>
          <div>
            <strong>سارة القحطاني</strong>
            <span class="badge">محامية</span>
          </div>
        </div>
        <p class="post-text">عقد الإيجار يجب أن يتضمن مدة الإيجار، قيمة الإيجار، وشروط الإنهاء. غياب أي منها قد يُفقد العقد قوته القانونية.</p>
        <div class="post-tags"><span>#عقود</span> <span>#إيجار</span></div>
        <div class="post-actions">
          <button class="like-btn" onclick="toggleLike(this)">❤️ <span>12</span></button>
          <button>💬 تعليق</button>
          <button>🔗 مشاركة</button>
        </div>
      </div>
    </section>

  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <h3>نشر محتوى قانوني</h3>
      <textarea id="postText" placeholder="اكتب منشورك القانوني..."></textarea>
      <input type="text" id="postTag" placeholder="الوسم مثال: #عقود" />
      <div class="modal-actions">
        <button class="btn-submit" id="submitPost">نشر</button>
        <button class="btn-cancel" id="closeModal">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
