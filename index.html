<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>موقعي</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">موقعي</h1>
      <button class="menu-btn" id="menuBtn" aria-label="فتح القائمة">&#9776;</button>
      <nav class="nav" id="nav">
        <ul>
          <li><a href="#home">الرئيسية</a></li>
          <li><a href="#about">عن الموقع</a></li>
          <li><a href="#contact">تواصل معنا</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="container">
        <h2>مرحبًا بك في موقعنا</h2>
        <p>تصميم بسيط وسريع يعمل على جميع الأجهزة</p>
        <a href="#contact" class="btn">تواصل معنا</a>
      </div>
    </section>

    <section class="about" id="about">
      <div class="container">
        <h2>عن الموقع</h2>
        <p>موقع متجاوب يعمل بكفاءة على الهاتف والحاسوب والتابلت.</p>
      </div>
    </section>

    <section class="contact" id="contact">
      <div class="container">
        <h2>تواصل معنا</h2>
        <form id="contactForm">
          <input type="text" placeholder="اسمك" required />
          <input type="email" placeholder="بريدك الإلكتروني" required />
          <textarea placeholder="رسالتك" rows="4" required></textarea>
          <button type="submit" class="btn">إرسال</button>
        </form>
        <p id="formMsg" class="form-msg hidden">تم الإرسال بنجاح!</p>
      </div>
    </section>
  </main>

  <footer>
    <p>جميع الحقوق محفوظة &copy; 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
