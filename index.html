<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة النشر</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="top-bar">
    <div class="positions-label">موضع النشر:</div>
    <div class="positions-list">
      <button class="pos-btn active" data-pos="الرئيسية">الرئيسية</button>
      <button class="pos-btn" data-pos="الأخبار">الأخبار</button>
      <button class="pos-btn" data-pos="التقارير">التقارير</button>
      <button class="pos-btn" data-pos="المقالات">المقالات</button>
      <button class="pos-btn" data-pos="الإعلانات">الإعلانات</button>
    </div>
  </header>

  <main class="container">
    <div class="selected-pos-banner">
      النشر في: <span id="selected-pos">الرئيسية</span>
    </div>

    <section class="publish-form">
      <h2>نشر محتوى جديد</h2>
      <input type="text" id="title" placeholder="عنوان المحتوى" />
      <textarea id="body" placeholder="اكتب المحتوى هنا..."></textarea>
      <button id="publish-btn">نشر الآن</button>
    </section>

    <section class="posts-list" id="posts-list">
      <h3>المنشورات</h3>
      <div id="posts-container">
        <p class="empty-msg">لا توجد منشورات بعد.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
